<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DShare 화면 공유</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="page" id="page">

    <div class="brand">
      <div class="brand-dot"></div>
      <span>DShare</span>
    </div>

    <div class="card" id="joinCard">
      <h1>화면 공유 연결</h1>
      <p class="sub">기기 화면에 표시된 6자리 코드를 입력하세요</p>
      <input id="codeInput" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
      <button id="btnJoin" class="btn btn-primary">연결</button>
      <p class="error" id="joinError"></p>
    </div>

    <div class="card" id="shareCard" hidden>
      <h1>연결됨</h1>
      <p class="sub" id="shareSub">아래 버튼을 누르면 공유할 화면/창을 선택하는<br/>브라우저 권한 요청이 표시됩니다</p>
      <button id="btnShare" class="btn btn-primary">화면 공유 시작</button>
      <button id="btnStop" class="btn btn-outline" hidden>공유 중지</button>
      <p class="error" id="shareError"></p>
    </div>

    <div class="overlay" id="connectingOverlay" hidden>
      <svg class="spinner" viewBox="0 0 50 50">
        <circle class="spinner-arc" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
      </svg>
      <p class="overlay-text">연결하는 중…</p>
    </div>

    <div class="overlay" id="successOverlay" hidden>
      <div class="check-circle" id="checkCircle">
        <svg viewBox="0 0 24 24" width="56" height="56">
          <path fill="#fff" d="M9.7,16.2L5.5,12l1.4,-1.4l2.8,2.8l6.4,-6.4l1.4,1.4z"/>
        </svg>
      </div>
      <p class="overlay-text" id="successCaption">연결되었습니다.</p>
    </div>

    <div class="overlay overlay-live" id="liveOverlay" hidden>
      <div class="live-aura"></div>
      <p class="overlay-text live-text">화면 공유 중</p>
      <button id="btnStop2" class="btn btn-outline live-stop">공유 중지</button>
    </div>

  </div>

<script src="/app.js"></script>
</body>
</html>
